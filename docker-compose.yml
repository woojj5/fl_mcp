services:
  fl-server:
    build: .
    command: >
      python run.py server
        --host 0.0.0.0
        --port 8080
        --model ${FL_MODEL:-simple_cnn}
        --dataset ${FL_DATASET:-cifar10}
        --rounds ${FL_ROUNDS:-20}
        --min-clients ${FL_MIN_CLIENTS:-2}
        --clients-per-round ${FL_CLIENTS_PER_ROUND:-2}
        --strategy ${FL_STRATEGY:-fedavg}
        --db /data/server_tracking.db
    ports:
      - "8080:8080"
    volumes:
      - fl-data:/data
      - ./certs:/certs:ro
    environment:
      FL_API_TOKEN: ${FL_API_TOKEN:?Set FL_API_TOKEN in .env}
      FL_TLS_CERT: /certs/server.crt
      FL_TLS_KEY: /certs/server.key
      FL_TLS_CA: /certs/server.crt
    networks: [fl-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,requests; requests.get('https://localhost:8080/health', verify=os.environ['FL_TLS_CA'], timeout=3).raise_for_status()"]
      interval: 10s
      retries: 5

  fl-client-0:
    build: .
    command: >
      python run.py client
        --server https://fl-server:8080
        --client-id client_0
        --port 8081
        --model ${FL_MODEL:-simple_cnn}
        --dataset ${FL_DATASET:-cifar10}
        --partition-id 0
        --num-clients-total ${FL_NUM_CLIENTS:-2}
        --split-type ${FL_SPLIT:-iid}
        --alpha ${FL_ALPHA:-0.5}
        --data-dir /data/datasets/client_0
        --local-epoch ${FL_LOCAL_EPOCH:-5}
        --lr ${FL_LR:-0.01}
        --batch-size ${FL_BATCH:-32}
    ports: ["8081:8081"]
    volumes:
      - fl-data:/data
      - ./certs:/certs:ro
    environment: &secure-node-env
      FL_API_TOKEN: ${FL_API_TOKEN:?Set FL_API_TOKEN in .env}
      FL_TLS_CERT: /certs/server.crt
      FL_TLS_KEY: /certs/server.key
      FL_TLS_CA: /certs/server.crt
    networks: [fl-net]
    depends_on:
      fl-server:
        condition: service_healthy

  fl-client-1:
    build: .
    command: >
      python run.py client
        --server https://fl-server:8080
        --client-id client_1
        --port 8082
        --model ${FL_MODEL:-simple_cnn}
        --dataset ${FL_DATASET:-cifar10}
        --partition-id 1
        --num-clients-total ${FL_NUM_CLIENTS:-2}
        --split-type ${FL_SPLIT:-iid}
        --alpha ${FL_ALPHA:-0.5}
        --data-dir /data/datasets/client_1
        --local-epoch ${FL_LOCAL_EPOCH:-5}
        --lr ${FL_LR:-0.01}
        --batch-size ${FL_BATCH:-32}
    ports: ["8082:8082"]
    volumes:
      - fl-data:/data
      - ./certs:/certs:ro
    environment: *secure-node-env
    networks: [fl-net]
    depends_on:
      fl-server:
        condition: service_healthy

  fl-dashboard:
    build: .
    command: >
      python run.py dashboard
        --host 0.0.0.0
        --port 5000
        --db /data/server_tracking.db
    ports: ["5000:5000"]
    volumes:
      - fl-data:/data
      - ./certs:/certs:ro
    environment:
      FL_API_TOKEN: ${FL_API_TOKEN:?Set FL_API_TOKEN in .env}
      FL_TLS_CERT: /certs/server.crt
      FL_TLS_KEY: /certs/server.key
      FL_TLS_CA: /certs/server.crt
      FL_DASHBOARD_USER: ${FL_DASHBOARD_USER:?Set FL_DASHBOARD_USER in .env}
      FL_DASHBOARD_PASSWORD: ${FL_DASHBOARD_PASSWORD:?Set FL_DASHBOARD_PASSWORD in .env}
      FL_SERVER_URL: https://fl-server:8080
      FL_CLIENT_URLS: https://fl-client-0:8081,https://fl-client-1:8082
    networks: [fl-net]
    depends_on: [fl-server]

networks:
  fl-net:
    driver: bridge

volumes:
  fl-data:
